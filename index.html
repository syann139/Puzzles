<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 末日全能追蹤 - 動態任務版</title>

        <!-- 自訂手機圖示 -->
    <link rel="apple-touch-icon" href="https://syann139.github.io/Puzzles/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="https://syann139.github.io/Puzzles/apple-touch-icon.png">
    
    <!-- Meta tags for Apple devices -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="末日追蹤">
    <link rel="apple-touch-icon" href="https://syann139.github.io/Puzzles/apple-touch-icon.png">
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; border-color: #ef4444; }
            50% { background-color: #fecaca; border-color: #dc2626; }
        }
        @keyframes modal-pop {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-urgent { animation: pulse-red 2s infinite; }
        .animate-modal { animation: modal-pop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .account-completed {
            opacity: 0.6;
            filter: grayscale(0.5);
            transition: all 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-pink-50 min-h-screen pb-10">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const STORAGE_KEY = 'puzzles_survival_v16_dynamic_tasks';
        const CYCLE_WEEKS = ["最強指揮官週", "王牌英雄週"];
        
        const WEEKLY_TASKS_MAP = {
            "最強指揮官週": { 1: "英雄崛起/奈米", 2: "發展之路", 3: "獵殺之路", 4: "練兵大師", 5: "器官精造", 6: "強化改造", 0: "終極之路" },
            "王牌英雄週": { 1: "英雄提升", 2: "避難所發展", 3: "裝備/晶核/藏品", 4: "生化人/元件", 5: "器官/榮耀", 6: "消耗鑽石(王牌)", 0: "鑽石/晶片/魔方" }
        };

        const decrementDays = (v) => {
            if (v === null || v === undefined || v === "") return "";
            const n = parseInt(v, 10);
            if (!isNaN(n)) return Math.max(0, n - 1).toString();
            return v;
        };

        const Icons = {
            ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>,
            ChevronRight: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Check: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Rotate: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>,
            Sync: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Edit: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Star: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>,
            EyeOff: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>,
            Clock: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        };

        function App() {
            const [groups, setGroups] = useState([]);
            const [appTitle, setAppTitle] = useState('🌸 末日全能追蹤');
            const [customEventName, setCustomEventName] = useState('限定活動');
            const [currentWeekType, setCurrentWeekType] = useState(CYCLE_WEEKS[0]);
            const [hideCompleted, setHideCompleted] = useState(false);
            const [showSync, setShowSync] = useState(false);
            const [backupText, setBackupText] = useState('');
            const [notification, setNotification] = useState('');
            const [prisonTimer, setPrisonTimer] = useState("");
            const [todayIndex, setTodayIndex] = useState(new Date().getDay());
            const [modalConfig, setModalConfig] = useState({ isOpen: false, type: '', title: '', value: '', placeholder: '', onConfirm: null });

            const showNotify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };

            const save = useCallback((newG, newT, newC) => {
                const data = {
                    groups: newG || groups,
                    appTitle: newT || appTitle,
                    customEventName: newC || customEventName
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [groups, appTitle, customEventName]);

            // 檢查週期性活動
            const checkPeriodicEvent = (anchorDateStr, cycleDays, durationDays = 7) => {
                const anchor = new Date(anchorDateStr);
                anchor.setHours(0,0,0,0);
                const now = new Date();
                now.setHours(0,0,0,0);
                const diffTime = now - anchor;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return false;
                const currentCycleDay = diffDays % cycleDays;
                return currentCycleDay >= 0 && currentCycleDay < durationDays;
            };

            const getActiveTasks = useCallback((weekType, day) => {
                const isCmdWeek = weekType === "最強指揮官週";
                const isHeroWeek = weekType === "王牌英雄週";
                
                return [
                    { key: 'daily', label: '日常', show: true },
                    { key: 'seed', label: '種子', show: true },
                    { key: 'mall', label: '商城', show: true },
                    // 一至三
                    { key: 'firefly', label: '螢火使者', show: isCmdWeek && [1,2,3].includes(day) },
                    { key: 'trial', label: '聯盟試練', show: isHeroWeek && [1,2,3].includes(day) },
                    { key: 'gacha', label: '777扭蛋', show: isHeroWeek && [1,2,3].includes(day) },
                    // 奪旗: 一個月一次, 指揮官週一二 (假設週期 28 天)
                    { key: 'flag', label: '奪旗報名', show: isCmdWeek && [1,2].includes(day) && checkPeriodicEvent('2026-04-27', 28, 2) },
                    // 巔峰: 指揮官週一開始維持 10 天
                    { key: 'apex', label: '巔峰', show: checkPeriodicEvent('2026-04-13', 28, 10) },
                    // 四至六
                    { key: 'special', label: '特種', show: [4,5,6].includes(day) },
                    { key: 'water_sup', label: '淨水支持', show: day === 4 },
                    // 五
                    { key: 'collins', label: '柯林斯QA', show: day === 5 },
                    // 五至日
                    { key: 'divine', label: '占卜抽獎', show: isCmdWeek && [5,6,0].includes(day) },
                    // 六
                    { key: 'water_reward', label: '淨水領獎', show: day === 6 },
                    // 六至日: 王牌週 + 週期
                    { key: 'scorch', label: '焦土領獎', show: isHeroWeek && [6,0].includes(day) && checkPeriodicEvent('2026-05-09', 28, 2) },
                    // 日
                    { key: 'destroyer', label: '毀滅者', show: day === 0 }
                ].filter(t => t.show);
            }, []);

            const isAccountDone = useCallback((acc) => {
                const activeTasks = getActiveTasks(currentWeekType, todayIndex);
                const tasksDone = activeTasks.every(t => acc[t.key]);
                return tasksDone && acc.dynamicDay && acc.customEvent;
            }, [currentWeekType, todayIndex, getActiveTasks]);

            const updateAccount = (groupId, accId, fields) => {
                setGroups(prev => {
                    const next = prev.map(g => g.id === groupId ? {
                        ...g, accounts: g.accounts.map(a => a.id === accId ? {...a, ...fields} : a)
                    } : g);
                    save(next);
                    return next;
                });
            };

            const updatePrisonDisplay = useCallback(() => {
                const cycle = 3 * 24 * 60 * 60 * 1000;
                const anchor = Date.UTC(2026, 3, 19, 0, 0, 0); 
                const now = Date.now();
                const remaining = ((anchor - now) % cycle + cycle) % cycle;
                const d = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const h = Math.floor((remaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((remaining % (1000 * 60)) / 1000);
                setPrisonTimer(`${d}D ${h.toString().padStart(2, '0')}h ${m.toString().padStart(2, '0')}m ${s.toString().padStart(2, '0')}s`);
            }, []);

            useEffect(() => {
                let loadedGroups = [];
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        loadedGroups = parsed.groups || [];
                        setAppTitle(parsed.appTitle || '🌸 末日全能追蹤');
                        setCustomEventName(parsed.customEventName || '限定活動');
                    } catch(e) {}
                }

                const checkDailyReset = (groupsToCheck, saveImmediate = false) => {
                    const now = new Date();
                    const resetTime = new Date(now);
                    resetTime.setHours(8, 0, 0, 0); 
                    if (now < resetTime) resetTime.setDate(resetTime.getDate() - 1);
                    const currentResetTime = resetTime.getTime();
                    const lastReset = localStorage.getItem('puzzles_survival_last_reset');

                    if (!lastReset || parseInt(lastReset, 10) < currentResetTime) {
                        const newGroups = groupsToCheck.map(g => ({
                            ...g, accounts: g.accounts.map(a => {
                                const resetObj = { dynamicDay: false, customEvent: false, pack: decrementDays(a.pack), mine1: decrementDays(a.mine1), crystal: decrementDays(a.crystal) };
                                [ 'daily', 'seed', 'mall', 'firefly', 'trial', 'gacha', 'flag', 'apex', 'special', 'water_sup', 'collins', 'divine', 'water_reward', 'scorch', 'destroyer' ].forEach(k => resetObj[k] = false);
                                return { ...a, ...resetObj };
                            })
                        }));
                        localStorage.setItem('puzzles_survival_last_reset', currentResetTime.toString());
                        if (saveImmediate) save(newGroups);
                        return newGroups;
                    }
                    return groupsToCheck;
                };

                const initializedGroups = checkDailyReset(loadedGroups.length ? loadedGroups : [
                    { id: 'g1', title: '382服 WTF', isOpen: true, accounts: [
                        { id: 'a1', name: '飄落的蒲公英 ҉͜', daily: false, seed: false, mall: false, pack: '', mine1: '', crystal: '' },
                    ]}
                ], true);
                
                setGroups(initializedGroups);
                const getWeekNumber = (d) => {
                    const date = new Date(d.getTime());
                    date.setHours(0, 0, 0, 0);
                    date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
                    const week1 = new Date(date.getFullYear(), 0, 4);
                    return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                };
                setCurrentWeekType(CYCLE_WEEKS[getWeekNumber(new Date()) % 2]);

                const timerId = setInterval(updatePrisonDisplay, 1000);
                const dailyCheckId = setInterval(() => {
                    setGroups(prev => checkDailyReset(prev, true));
                    setTodayIndex(new Date().getDay());
                }, 60000);

                updatePrisonDisplay();
                return () => { clearInterval(timerId); clearInterval(dailyCheckId); };
            }, [updatePrisonDisplay, save]);

            const copyToClipboard = () => {
                const code = localStorage.getItem(STORAGE_KEY) || '';
                setBackupText(code);
                const textArea = document.createElement("textarea");
                textArea.value = code;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showNotify("代碼已複製！");
                } catch (err) {
                    showNotify("複製失敗，請手動複製上方代碼。");
                }
                document.body.removeChild(textArea);
            };

            const dayTaskName = WEEKLY_TASKS_MAP[currentWeekType][todayIndex] || "一般任務";
            const overallStats = useMemo(() => {
                const all = groups.flatMap(g => g.accounts);
                if (all.length === 0) return { percent: 0, done: 0, total: 0 };
                const done = all.filter(isAccountDone).length;
                return { percent: Math.round((done / all.length) * 100), done, total: all.length };
            }, [groups, isAccountDone]);

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">
                    {notification && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold border-2 border-pink-400 text-center whitespace-nowrap">
                            {notification}
                        </div>
                    )}

                    {modalConfig.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[400] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl animate-modal border border-pink-100">
                                <h3 className="text-slate-700 font-black mb-4 text-lg">{modalConfig.title}</h3>
                                {modalConfig.type === 'PROMPT' && (
                                    <input type="text" className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm font-bold mb-4 outline-none focus:border-pink-400 focus:bg-white transition-colors" placeholder={modalConfig.placeholder} value={modalConfig.value} onChange={(e) => setModalConfig({ ...modalConfig, value: e.target.value })} autoFocus />
                                )}
                                <div className="flex gap-3 mt-2">
                                    <button onClick={() => setModalConfig({ isOpen: false, type: '', title: '', value: '', placeholder: '', onConfirm: null })} className="flex-1 py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl text-sm hover:bg-slate-200 transition-colors">取消</button>
                                    <button onClick={() => { if (modalConfig.onConfirm) modalConfig.onConfirm(modalConfig.type === 'PROMPT' ? modalConfig.value : null); setModalConfig({ isOpen: false, type: '', title: '', value: '', placeholder: '', onConfirm: null }); }} className="flex-1 py-3 bg-pink-500 text-white font-bold rounded-2xl text-sm hover:bg-pink-600 transition-colors shadow-sm">確定</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="bg-white/90 backdrop-blur-md p-4 rounded-[1.5rem] shadow-sm border border-pink-100 flex flex-col gap-3 sticky top-4 z-50">
                        <div className="flex items-center justify-between gap-4">
                            <div className="flex flex-col flex-1">
                                <input type="text" value={appTitle} onChange={(e) => {setAppTitle(e.target.value); save(null, e.target.value);}} className="bg-transparent font-black text-lg text-slate-700 outline-none w-full" />
                                <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] font-bold">
                                    <span className="text-pink-500 flex items-center gap-1"><Icons.Star /> {currentWeekType}</span>
                                    <span className={`flex items-center gap-1 px-2 py-0.5 rounded-full border shadow-sm transition-colors ${prisonTimer.startsWith('0D') ? 'bg-red-50 border-red-200 text-red-500 animate-pulse' : 'bg-indigo-50 border-indigo-100 text-indigo-600'}`}>
                                        <Icons.Clock /> 監獄訓練：{prisonTimer}
                                    </span>
                                </div>
                            </div>
                            <div className="flex gap-1.5">
                                <button onClick={() => { 
                                    setModalConfig({
                                        isOpen: true, type: 'CONFIRM', title: '確定重置勾選並使天數 -1？',
                                        onConfirm: () => {
                                            const next = groups.map(g => ({
                                                ...g, accounts: g.accounts.map(a => {
                                                    const res = { dynamicDay:false, customEvent:false, pack: decrementDays(a.pack), mine1: decrementDays(a.mine1), crystal: decrementDays(a.crystal) };
                                                    ['daily', 'seed', 'mall', 'firefly', 'trial', 'gacha', 'flag', 'apex', 'special', 'water_sup', 'collins', 'divine', 'water_reward', 'scorch', 'destroyer'].forEach(k => res[k] = false);
                                                    return { ...a, ...res };
                                                })
                                            }));
                                            setGroups(next); save(next); showNotify("✅ 已手動換日重置");
                                        }
                                    });
                                }} className="p-2.5 bg-pink-50 hover:bg-pink-100 text-pink-500 rounded-xl border border-pink-100 transition-colors"><Icons.Rotate /></button>
                                <button onClick={() => setHideCompleted(!hideCompleted)} className={`p-2.5 rounded-xl transition-all ${hideCompleted ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}><Icons.EyeOff /></button>
                                <button onClick={() => setShowSync(true)} className="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-xl transition-colors"><Icons.Sync /></button>
                            </div>
                        </div>
                        <div className="w-full bg-slate-100 h-4 rounded-full overflow-hidden relative">
                            <div className="h-full bg-gradient-to-r from-pink-400 to-indigo-500 transition-all duration-700" style={{ width: `${overallStats.percent}%` }}></div>
                            <span className="absolute inset-0 flex items-center justify-center text-[9px] font-black text-slate-600">達成率 {overallStats.percent}% ({overallStats.done}/{overallStats.total})</span>
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-2 justify-center">
                        <div className="px-4 py-1.5 bg-indigo-600 text-white rounded-full text-[10px] font-bold shadow-sm">📅 今日任務：{dayTaskName}</div>
                        <div className="px-4 py-1.5 bg-amber-500 hover:bg-amber-600 transition-colors text-white rounded-full text-[10px] font-bold shadow-sm flex items-center gap-2 cursor-pointer" onClick={() => {
                                setModalConfig({ isOpen: true, type: 'PROMPT', title: '更換活動名稱：', value: customEventName, placeholder: '輸入活動名稱', onConfirm: (val) => { if (val) { setCustomEventName(val); save(null, null, val); } } });
                             }}>🔥 {customEventName} <Icons.Edit />
                        </div>
                    </div>

                    <div className="space-y-4">
                        {groups.map(group => {
                            const displayedAccounts = hideCompleted ? group.accounts.filter(acc => !isAccountDone(acc)) : group.accounts;
                            if (hideCompleted && displayedAccounts.length === 0) return null;

                            return (
                                <div key={group.id} className="bg-white/60 border border-white rounded-[2rem] overflow-hidden shadow-sm transition-all">
                                    <div className="flex items-center p-3 bg-white/80 border-b border-pink-50 transition-colors">
                                        <div className="flex-1 flex items-center gap-2 cursor-pointer" onClick={() => { const next = groups.map(g => g.id === group.id ? {...g, isOpen: !g.isOpen} : g); setGroups(next); save(next); }}>
                                            <div className="text-pink-400">{group.isOpen ? <Icons.ChevronDown /> : <Icons.ChevronRight />}</div>
                                            <span className="font-black text-slate-600 text-sm">{group.title}</span>
                                        </div>
                                        <button onClick={(e) => {
                                            e.stopPropagation();
                                            setModalConfig({
                                                isOpen: true, type: 'PROMPT', title: '新增角色名稱：', value: '', placeholder: '輸入角色名稱',
                                                onConfirm: (val) => {
                                                    if(val) {
                                                        const next = groups.map(g => g.id === group.id ? {...g, accounts: [...g.accounts, { id: Date.now().toString(), name: val, daily: false, dynamicDay: false, customEvent: false, pack: '', mine1: '', crystal: '' }]} : g);
                                                        setGroups(next); save(next);
                                                    }
                                                }
                                            });
                                        }} className="p-2 text-pink-400 bg-pink-50 hover:bg-pink-100 rounded-lg mr-2 transition-colors"><Icons.Plus /></button>
                                    </div>
                                    
                                    {group.isOpen && (
                                        <div className="p-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                            {displayedAccounts.map(acc => {
                                                const done = isAccountDone(acc);
                                                const activeTasks = getActiveTasks(currentWeekType, todayIndex);
                                                return (
                                                    <div key={acc.id} className={`bg-white rounded-[1.8rem] p-4 border border-pink-50 shadow-sm flex flex-col gap-4 relative transition-all duration-300 ${done ? 'account-completed ring-2 ring-emerald-400' : ''}`}>
                                                        <div className="flex items-center gap-2">
                                                            <input type="text" value={acc.name} onChange={(e) => updateAccount(group.id, acc.id, { name: e.target.value })} className="font-black outline-none text-xs flex-1 bg-transparent" />
                                                            
                                                            {!done && (
                                                                <button 
                                                                    onClick={() => {
                                                                        const updates = { dynamicDay: true, customEvent: true };
                                                                        activeTasks.forEach(t => updates[t.key] = true);
                                                                        updateAccount(group.id, acc.id, updates);
                                                                        showNotify(`✅ 已完成 ${acc.name} 今日任務`);
                                                                    }}
                                                                    className="w-6 h-6 flex items-center justify-center bg-emerald-50 text-emerald-500 hover:bg-emerald-100 rounded-lg transition-colors"
                                                                    title="一鍵完成今日所有打卡"
                                                                >
                                                                    <Icons.Check />
                                                                </button>
                                                            )}

                                                            <button onClick={() => { 
                                                                setModalConfig({
                                                                    isOpen: true, type: 'CONFIRM', title: `確定刪除角色「${acc.name}」？`,
                                                                    onConfirm: () => {
                                                                        const next = groups.map(g => g.id === group.id ? {...g, accounts: g.accounts.filter(a => a.id !== acc.id)} : g); setGroups(next); save(next);
                                                                    }
                                                                });
                                                            }} className="text-slate-200 hover:text-red-400 transition-colors"><Icons.Trash /></button>
                                                        </div>
                                                        
                                                        {/* 第一區：週任務與活動 */}
                                                        <div className="flex gap-2 p-2 bg-slate-50 rounded-2xl border border-slate-100">
                                                            <div className="flex-1 flex flex-col items-center gap-1">
                                                                <span className="text-[9px] text-indigo-600 font-black truncate w-full text-center">{dayTaskName}</span>
                                                                <button onClick={() => updateAccount(group.id, acc.id, { dynamicDay: !acc.dynamicDay })} className={`w-full h-8 rounded-xl flex items-center justify-center transition-all ${acc.dynamicDay ? 'bg-indigo-600 text-white shadow-md' : 'bg-white border border-indigo-100 text-transparent hover:bg-indigo-50'}`}><Icons.Check /></button>
                                                            </div>
                                                            <div className="flex-1 flex flex-col items-center gap-1">
                                                                <span className="text-[9px] text-amber-600 font-black truncate w-full text-center">{customEventName}</span>
                                                                <button onClick={() => updateAccount(group.id, acc.id, { customEvent: !acc.customEvent })} className={`w-full h-8 rounded-xl flex items-center justify-center transition-all ${acc.customEvent ? 'bg-amber-500 text-white shadow-md' : 'bg-white border border-amber-100 text-transparent hover:bg-amber-50'}`}><Icons.Check /></button>
                                                            </div>
                                                        </div>

                                                        {/* 第二區：動態顯示細分任務 */}
                                                        <div className="grid grid-cols-4 gap-1.5">
                                                            {activeTasks.map(t => (
                                                                <div key={t.key} className="flex flex-col items-center gap-1">
                                                                    <span className="text-[9px] text-slate-400 font-bold truncate w-full text-center">{t.label}</span>
                                                                    <button onClick={() => updateAccount(group.id, acc.id, { [t.key]: !acc[t.key] })} className={`w-8 h-8 rounded-xl flex items-center justify-center transition-all ${acc[t.key] ? 'bg-pink-500 text-white shadow-sm scale-110' : 'bg-slate-50 text-transparent border border-slate-100 hover:bg-pink-50'}`}><Icons.Check /></button>
                                                                </div>
                                                            ))}
                                                        </div>

                                                        {/* 第三區：救援包與資源倒數 */}
                                                        <div className="grid grid-cols-3 gap-2 border-t border-slate-50 pt-3">
                                                            {[ {key: 'pack', label: '救援包'}, {key: 'mine1', label: '金礦'}, {key: 'crystal', label: '晶核'} ].map(c => {
                                                                const num = parseInt(acc[c.key], 10);
                                                                const isUrgent = !isNaN(num) && num <= 0 && acc[c.key] !== "";
                                                                const displayValue = (isUrgent && acc[c.key] === '0') ? '領獎' : (acc[c.key] || '');
                                                                return (
                                                                    <div key={c.key} className="flex flex-col items-center gap-1">
                                                                        <span className="text-[9px] text-slate-400 font-bold">{c.label}</span>
                                                                        <div className={`w-full h-8 rounded-xl border flex items-center justify-center relative transition-colors ${isUrgent ? 'animate-urgent border-red-500 text-red-600 font-black' : 'bg-white border-slate-100'}`}>
                                                                            <input type="text" value={displayValue} onMouseDown={(e) => { if (displayValue === '領獎') { e.preventDefault(); updateAccount(group.id, acc.id, { [c.key]: '30' }); } }} onFocus={(e) => { if (displayValue !== '領獎') e.target.select(); }} onChange={(e) => updateAccount(group.id, acc.id, { [c.key]: e.target.value.replace(/\D/g,'') })} className="w-full bg-transparent text-center text-[10px] font-black outline-none placeholder-slate-300" placeholder="-" />
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {showSync && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] w-full max-sm p-6 shadow-2xl animate-modal border border-slate-100">
                                <h3 className="text-pink-500 font-black mb-4 flex items-center gap-2"><Icons.Sync /> 同步數據</h3>
                                <textarea className="w-full h-40 bg-slate-50 border border-slate-200 focus:border-pink-400 rounded-2xl p-4 text-[10px] font-mono mb-4 outline-none no-scrollbar transition-colors" value={backupText} onChange={(e) => setBackupText(e.target.value)} placeholder="貼上備份代碼..." />
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={copyToClipboard} className="py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl text-sm transition-colors">複製備份</button>
                                    <button onClick={() => { try { const p = JSON.parse(backupText); setGroups(p.groups); setAppTitle(p.appTitle); setCustomEventName(p.customEventName || '限定活動'); setShowSync(false); localStorage.setItem(STORAGE_KEY, backupText); showNotify("導入成功！"); } catch(e) { showNotify("格式錯誤"); } }} className="py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-2xl text-sm shadow-sm transition-colors">導入數據</button>
                                </div>
                                <button onClick={() => setShowSync(false)} className="w-full mt-4 text-slate-400 hover:text-slate-600 text-xs font-bold text-center transition-colors">關閉</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
