<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌸 末日全能追蹤 - 活動版</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="末日追蹤">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: #fee2e2; border-color: #ef4444; }
            50% { background-color: #fecaca; border-color: #dc2626; }
        }
        .animate-urgent { animation: pulse-red 2s infinite; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            touch-action: pan-y;
            padding-top: env(safe-area-inset-top);
        }
        .drag-handle { cursor: grab; padding: 8px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-pink-50 min-h-screen pb-10">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const STORAGE_KEY = 'puzzles_survival_v9_weekly_cycle';

        // 任務配置
        const CYCLE_WEEKS = ["最強指揮官週", "王牌英雄週"];
        
        const WEEKLY_TASKS_MAP = {
            "最強指揮官週": {
                1: "英雄崛起/奈米", 
                2: "發展之路", 
                3: "獵殺之路", 
                4: "練兵大師", 
                5: "器官精造", 
                6: "強化改造(全能)", 
                0: "終極之路(全能)"
            },
            "王牌英雄週": {
                1: "英雄提升", 
                2: "避難所發展", 
                3: "裝備/晶核/藏品", 
                4: "生化人/元件", 
                5: "器官/榮耀", 
                6: "消耗鑽石(王牌)", 
                0: "鑽石/晶片/魔方"
            }
        };

        const initialGroups = [
            { id: 'g1', title: '382服 WTF', isOpen: true, accounts: [
                { id: 'a1', name: '飄落的蒲公英 ҉͜', daily: false, commander: false, hero: false, mall: false, base: false, ops: false, event: false, water: false, dynamicDay: false, customEvent: false, pack: '', mine1: '', crystal: '' },
                { id: 'a2', name: '☪淺月夜未央︎৯', daily: false, commander: false, hero: false, mall: false, base: false, ops: false, event: false, water: false, dynamicDay: false, customEvent: false, pack: '', mine1: '', crystal: '' }
            ]},
            { id: 'g4', title: '538服 WTF', isOpen: true, accounts: [
                { id: 'a6', name: '小小1號', daily: false, commander: false, hero: false, mall: false, base: false, ops: false, event: false, water: false, dynamicDay: false, customEvent: false, pack: '', mine1: '', crystal: '' }
            ]}
        ];

        const Icons = {
            ChevronDown: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>,
            ChevronRight: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>,
            Check: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>,
            Plus: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
            Trash: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Drag: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>,
            Sync: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            Edit: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Star: () => <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        };

        function App() {
            const [groups, setGroups] = useState([]);
            const [customEventName, setCustomEventName] = useState('限定活動');
            const [appTitle, setAppTitle] = useState('🌸 末日全能追蹤');
            const [currentWeekType, setCurrentWeekType] = useState(CYCLE_WEEKS[0]);
            const [notification, setNotification] = useState('');
            const [showSync, setShowSync] = useState(false);
            const [backupText, setBackupText] = useState('');

            // 計算日期與週數
            const today = new Date();
            const todayIndex = today.getDay(); // 0 是週日

            // 計算該週是哪一種類型 (簡單邏輯：根據年份的週數切換)
            useEffect(() => {
                const getWeekNumber = (d) => {
                    const date = new Date(d.getTime());
                    date.setHours(0, 0, 0, 0);
                    date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
                    const week1 = new Date(date.getFullYear(), 0, 4);
                    return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
                };
                const weekNum = getWeekNumber(today);
                setCurrentWeekType(CYCLE_WEEKS[weekNum % 2]); // 每週交替
            }, []);

            const dayTaskName = useMemo(() => {
                return WEEKLY_TASKS_MAP[currentWeekType][todayIndex] || "一般任務";
            }, [currentWeekType, todayIndex]);

            const persist = (data) => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            const showNotify = (msg) => { setNotification(msg); setTimeout(() => setNotification(''), 3000); };

            const executeDailyReset = (currentGroups) => {
                return currentGroups.map(g => ({
                    ...g,
                    accounts: g.accounts.map(a => {
                        const dec = (v) => {
                            const n = parseInt(v, 10);
                            return (isNaN(n) || n <= 0) ? '' : (n - 1).toString();
                        };
                        return {
                            ...a,
                            daily: false, commander: false, hero: false, mall: false, 
                            base: false, ops: false, event: false, water: false,
                            dynamicDay: false, customEvent: false,
                            pack: dec(a.pack), mine1: dec(a.mine1), crystal: dec(a.crystal)
                        };
                    })
                }));
            };

            useEffect(() => {
                const savedRaw = localStorage.getItem(STORAGE_KEY);
                let currentGroups = initialGroups;
                let currentTitle = '🌸 末日全能追蹤';
                let currentCustomEvent = '限定活動';
                let lastResetDate = "";

                if (savedRaw) {
                    try {
                        const parsed = JSON.parse(savedRaw);
                        if (Array.isArray(parsed.groups)) currentGroups = parsed.groups;
                        if (parsed.appTitle) currentTitle = parsed.appTitle;
                        if (parsed.customEventName) currentCustomEvent = parsed.customEventName;
                        if (parsed.lastResetDate) lastResetDate = parsed.lastResetDate;
                    } catch(e) {}
                }

                const todayStr = today.toLocaleDateString('zh-HK');
                if (today.getHours() >= 8 && lastResetDate !== todayStr) {
                    currentGroups = executeDailyReset(currentGroups);
                    lastResetDate = todayStr;
                    showNotify(`☀️ 換日成功！本週為：${currentWeekType}`);
                }

                setGroups(currentGroups);
                setAppTitle(currentTitle);
                setCustomEventName(currentCustomEvent);
                persist({ groups: currentGroups, appTitle: currentTitle, customEventName: currentCustomEvent, lastResetDate: todayStr });
            }, [currentWeekType]);

            const saveAll = (newG, newT, newC) => {
                const g = newG || groups;
                const t = newT !== undefined ? newT : appTitle;
                const c = newC !== undefined ? newC : customEventName;
                const savedRaw = localStorage.getItem(STORAGE_KEY);
                let lastD = new Date().toLocaleDateString('zh-HK');
                if(savedRaw) try { lastD = JSON.parse(savedRaw).lastResetDate; } catch(e){}
                persist({ groups: g, appTitle: t, customEventName: c, lastResetDate: lastD });
            };

            const updateAccount = (groupId, accId, fields) => {
                const next = groups.map(g => g.id === groupId ? {
                    ...g, accounts: g.accounts.map(a => a.id === accId ? {...a, ...fields} : a)
                } : g);
                setGroups(next);
                saveAll(next);
            };

            return (
                <div className="p-4 md:p-8 max-w-6xl mx-auto space-y-6">
                    {notification && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 z-[200] bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-2xl font-bold border-2 border-pink-400">
                            {notification}
                        </div>
                    )}

                    {/* 頂部控制列 */}
                    <div className="bg-white/90 backdrop-blur-md p-4 rounded-[1.5rem] shadow-sm border border-pink-100 flex items-center justify-between gap-4 sticky top-4 z-50">
                        <div className="flex flex-col">
                            <input 
                                type="text" value={appTitle} 
                                onChange={(e) => {setAppTitle(e.target.value); saveAll(null, e.target.value);}}
                                className="bg-transparent font-black text-lg text-slate-700 outline-none w-full"
                            />
                            <div className="flex items-center gap-1 text-[10px] text-pink-500 font-bold">
                                <Icons.Star /> {currentWeekType}
                            </div>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setShowSync(true)} className="p-2.5 bg-slate-100 text-slate-500 rounded-xl active:scale-95"><Icons.Sync /></button>
                        </div>
                    </div>

                    {/* 動態任務標籤 */}
                    <div className="flex flex-wrap gap-2 justify-center">
                        <div className="px-4 py-1.5 bg-indigo-600 text-white rounded-full text-[10px] font-bold shadow-sm shadow-indigo-200">
                            📅 今日任務：{dayTaskName}
                        </div>
                        <div 
                            className="px-4 py-1.5 bg-amber-500 text-white rounded-full text-[10px] font-bold shadow-sm shadow-amber-100 flex items-center gap-2 cursor-pointer"
                            onClick={() => {
                                const n = prompt("輸入新的臨時活動名稱：", customEventName);
                                if(n) { setCustomEventName(n); saveAll(null, null, n); }
                            }}
                        >
                            🔥 {customEventName} <Icons.Edit />
                        </div>
                    </div>

                    <div className="space-y-4">
                        {groups.map(group => (
                            <div key={group.id} className="bg-white/60 border border-white rounded-[2rem] overflow-hidden shadow-sm">
                                <div className="flex items-center p-3 bg-white/80 border-b border-pink-50">
                                    <div className="drag-handle text-slate-300 mr-2"><Icons.Drag /></div>
                                    <div className="flex-1 flex items-center gap-2 cursor-pointer" onClick={() => {
                                        const next = groups.map(g => g.id === group.id ? {...g, isOpen: !g.isOpen} : g);
                                        setGroups(next); saveAll(next);
                                    }}>
                                        <div className="text-pink-400">{group.isOpen ? <Icons.ChevronDown /> : <Icons.ChevronRight />}</div>
                                        <span className="font-black text-slate-600 text-sm">{group.title}</span>
                                    </div>
                                    <button onClick={() => {
                                        const next = groups.map(g => g.id === group.id ? {...g, accounts: [...g.accounts, { id: Date.now().toString(), name: '新成員', daily: false, commander: false, hero: false, mall: false, base: false, ops: false, event: false, water: false, dynamicDay: false, customEvent: false, pack: '', mine1: '', crystal: '' }]} : g);
                                        setGroups(next); saveAll(next);
                                    }} className="p-2 text-pink-400"><Icons.Plus /></button>
                                </div>

                                {group.isOpen && (
                                    <div className="p-3 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                                        {group.accounts.map(acc => (
                                            <div key={acc.id} className="bg-white rounded-[1.8rem] p-4 border border-pink-50 shadow-sm flex flex-col gap-4">
                                                <div className="flex items-center gap-2">
                                                    <input 
                                                        type="text" value={acc.name} 
                                                        onChange={(e) => updateAccount(group.id, acc.id, { name: e.target.value })}
                                                        className="font-black text-slate-700 outline-none text-xs flex-1 bg-transparent"
                                                    />
                                                    <button onClick={() => {
                                                        if(confirm(`刪除 ${acc.name}?`)) {
                                                            const next = groups.map(g => g.id === group.id ? {...g, accounts: g.accounts.filter(a => a.id !== acc.id)} : g);
                                                            setGroups(next); saveAll(next);
                                                        }
                                                    }} className="text-slate-200"><Icons.Trash /></button>
                                                </div>

                                                {/* 活動/臨時任務區 - 強調 */}
                                                <div className="flex gap-2 p-2 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <div className="flex-1 flex flex-col items-center gap-1">
                                                        <span className="text-[9px] text-indigo-600 font-black truncate w-full text-center">{dayTaskName}</span>
                                                        <button 
                                                            onClick={() => updateAccount(group.id, acc.id, { dynamicDay: !acc.dynamicDay })}
                                                            className={`w-full h-8 rounded-xl flex items-center justify-center transition-all ${acc.dynamicDay ? 'bg-indigo-600 text-white shadow-md' : 'bg-white border border-indigo-100 text-transparent'}`}
                                                        >
                                                            <Icons.Check />
                                                        </button>
                                                    </div>
                                                    <div className="flex-1 flex flex-col items-center gap-1">
                                                        <span className="text-[9px] text-amber-600 font-black truncate w-full text-center">{customEventName}</span>
                                                        <button 
                                                            onClick={() => updateAccount(group.id, acc.id, { customEvent: !acc.customEvent })}
                                                            className={`w-full h-8 rounded-xl flex items-center justify-center transition-all ${acc.customEvent ? 'bg-amber-500 text-white shadow-md' : 'bg-white border border-amber-100 text-transparent'}`}
                                                        >
                                                            <Icons.Check />
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* 常規任務區 */}
                                                <div className="grid grid-cols-4 gap-1.5">
                                                    {[
                                                        {key: 'daily', label: '日常'}, {key: 'commander', label: '指揮官'}, 
                                                        {key: 'hero', label: '英雄'}, {key: 'mall', label: '商城'},
                                                        {key: 'base', label: '基地'}, {key: 'ops', label: '特作'}, 
                                                        {key: 'event', label: '活動'}, {key: 'water', label: '淨水'}
                                                    ].map(t => (
                                                        <div key={t.key} className="flex flex-col items-center gap-1">
                                                            <span className="text-[9px] text-slate-400 font-bold">{t.label}</span>
                                                            <button 
                                                                onClick={() => updateAccount(group.id, acc.id, { [t.key]: !acc[t.key] })}
                                                                className={`w-8 h-8 rounded-xl flex items-center justify-center transition-all ${acc[t.key] ? 'bg-pink-500 text-white shadow-sm' : 'bg-slate-50 text-transparent border border-slate-100'}`}
                                                            >
                                                                <Icons.Check />
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* 倒數計時區 */}
                                                <div className="grid grid-cols-3 gap-2 mt-1">
                                                    {[
                                                        {key: 'pack', label: '救援包'}, {key: 'mine1', label: '金礦'}, {key: 'crystal', label: '晶核'}
                                                    ].map(c => {
                                                        const num = parseInt(acc[c.key], 10);
                                                        const isUrgent = !isNaN(num) && num <= 0;
                                                        return (
                                                            <div key={c.key} className="flex flex-col items-center gap-1">
                                                                <span className="text-[9px] text-slate-400 font-bold">{c.label}</span>
                                                                <div 
                                                                    className={`w-full h-8 rounded-xl border flex items-center justify-center relative ${isUrgent ? 'animate-urgent border-red-500 text-red-600' : 'bg-white border-slate-100'}`}
                                                                    onClick={() => isUrgent && updateAccount(group.id, acc.id, { [c.key]: '30' })}
                                                                >
                                                                    <input 
                                                                        type="text" value={isUrgent ? '領' : (acc[c.key] || '')}
                                                                        onChange={(e) => updateAccount(group.id, acc.id, { [c.key]: e.target.value.replace(/\D/g,'') })}
                                                                        className="w-full bg-transparent text-center text-[10px] font-black outline-none"
                                                                        placeholder="-"
                                                                    />
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {showSync && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[300] flex items-center justify-center p-4">
                            <div className="bg-white rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl border border-white">
                                <h3 className="text-pink-500 font-black mb-4 flex items-center gap-2"><Icons.Sync /> 同步數據</h3>
                                <textarea 
                                    className="w-full h-40 bg-slate-50 border border-slate-100 rounded-2xl p-4 text-[10px] font-mono mb-4 outline-none no-scrollbar"
                                    value={backupText} onChange={(e) => setBackupText(e.target.value)}
                                    placeholder="貼上備份代碼..."
                                />
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => {
                                        const code = localStorage.getItem(STORAGE_KEY);
                                        setBackupText(code);
                                        navigator.clipboard.writeText(code).then(() => showNotify("代碼已複製！"));
                                    }} className="py-3 bg-slate-100 text-slate-600 font-bold rounded-2xl">複製備份</button>
                                    <button onClick={() => {
                                        try {
                                            const p = JSON.parse(backupText);
                                            setGroups(p.groups); setAppTitle(p.appTitle); setCustomEventName(p.customEventName || '限定活動');
                                            setShowSync(false); persist(p); showNotify("導入成功！");
                                        } catch(e) { showNotify("代碼格式不正確"); }
                                    }} className="py-3 bg-pink-500 text-white font-bold rounded-2xl">導入數據</button>
                                </div>
                                <button onClick={() => setShowSync(false)} className="w-full mt-4 text-slate-300 text-xs font-bold text-center">關閉</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
